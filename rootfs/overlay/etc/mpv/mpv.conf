# Light settings for the Exynos 5250 (software decoding). "mpv <youtube url>" works through yt-dlp
# and is much smoother than the browser: H.264 only, at most 480p.
profile=fast
vo=x11
framedrop=vo
vd-lavc-fast=yes
vd-lavc-skiploopfilter=nonref
ytdl-format=bestvideo[height<=480][vcodec^=avc1]+bestaudio/best[height<=480]/best
