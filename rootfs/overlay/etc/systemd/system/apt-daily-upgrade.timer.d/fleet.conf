# The stock timer is "Persistent" and fires right after boot when a run was missed (these machines are often
# off at 06:00), which cost 8.5 s of CPU/eMMC during the first minutes. Run 30 min after boot, then daily.
[Timer]
OnCalendar=
OnBootSec=30min
OnUnitActiveSec=1d
Persistent=false
RandomizedDelaySec=10min
