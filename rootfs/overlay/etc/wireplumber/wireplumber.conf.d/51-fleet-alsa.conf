# Let PipeWire handle the volume in software and leave the codec's amplifier gain alone.
# Without this, PipeWire drives the hardware "Speaker" control to 100 % (+12 dB), which distorts, and the
# panel volume slider and the hardware mixer can disagree. The amplifier level set by fleet-audio-init stays.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
